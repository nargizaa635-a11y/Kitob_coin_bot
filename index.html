<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitob Ovi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #F5F4FF;
    --card: #FFFFFF;
    --card-2: #F0EEFB;
    --accent: #4F46E5;
    --accent-light: #6366F1;
    --accent-2: #F59E0B;
    --text: #1E1B2E;
    --text-dim: #6B7280;
    --success: #16A34A;
    --danger: #DC2626;
    --border: #E5E1F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 80px;
    min-height: 100vh;
  }
  .header {
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .balance-pill {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
  }
  .container { padding: 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(79, 70, 229, 0.06);
  }
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 9.5px;
    padding: 8px 1px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--accent);
    background: rgba(79, 70, 229, 0.1);
  }
  .tab-btn .icon { font-size: 17px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
  }
  .btn-disabled {
    background: var(--card-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  /* ===== SIRLI SANDIQ ===== */
  .chest-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .chest-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(79, 70, 229, 0.08);
    position: relative;
    overflow: hidden;
  }
  .chest-emoji {
    font-size: 52px;
    margin-bottom: 10px;
    display: block;
  }
  .chest-name {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .chest-cost {
    font-size: 14px;
    color: #b45309;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .chest-limit {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .chest-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    border: none;
    padding: 12px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    width: 100%;
    cursor: pointer;
  }
  .chest-btn:disabled {
    background: #E5E1F5;
    color: var(--text-dim);
    cursor: not-allowed;
  }

  /* Animatsiya */
  .chest-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
  }
  .chest-overlay.show { display: flex; }
  .chest-anim {
    font-size: 90px;
    animation: bounce 0.6s ease infinite alternate;
  }
  @keyframes bounce {
    from { transform: scale(1) rotate(-5deg); }
    to { transform: scale(1.15) rotate(5deg); }
  }
  .reward-box {
    background: white;
    border-radius: 20px;
    padding: 28px 36px;
    text-align: center;
    margin-top: 20px;
    animation: popIn 0.4s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .reward-text {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    margin-top: 8px;
  }

  /* Boshqa stillar (qisqartirilgan) */
  .book-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .book-author { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  .page-indicator { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
  .page-text { line-height: 1.7; font-size: 15px; color: #33303f; min-height: 180px; }
  .big-balance { text-align: center; padding: 24px 0; }
  .big-balance .num {
    font-size: 42px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .big-balance .label { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .ref-box {
    display: flex; gap: 8px; align-items: center;
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  .ref-link { flex: 1; font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-btn {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .info-text { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin-top: 14px; }
  .lb-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .lb-tab-btn {
    flex: 1; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px; border-radius: 10px;
    font-weight: 700; font-size: 12.5px; cursor: pointer;
  }
  .lb-tab-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white; border-color: transparent;
  }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { width: 24px; text-align: center; font-weight: 800; color: var(--accent); font-size: 13px; }
  .lb-name { flex: 1; font-weight: 700; font-size: 13.5px; }
  .lb-value { font-weight: 800; font-size: 13.5px; color: var(--text-dim); }
  .shop-item {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: var(--card-2); border-radius: 14px; margin-bottom: 10px;
  }
  .shop-emoji { font-size: 30px; }
  .shop-info { flex: 1; }
  .shop-name { font-weight: 700; font-size: 14px; }
  .shop-cost { color: #b45309; font-size: 13px; font-weight: 600; margin-top: 2px; }
  .buy-btn {
    background: var(--accent); color: white; border: none;
    padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .buy-btn:disabled { background: #E5E1F5; color: var(--text-dim); cursor: not-allowed; }
  .owned-tag {
    background: rgba(22, 163, 74, 0.12); color: var(--success);
    font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 10px;
  }
  .profile-header { display: flex; align-items: center; gap: 14px; padding: 6px 2px 20px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: white;
  }
  .profile-name { font-size: 17px; font-weight: 700; }
  .profile-username { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 6px; text-align: center;
  }
  .stat-box .num { font-size: 18px; font-weight: 800; color: var(--accent); }
  .stat-box .label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .quiz-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 12px;
  }
  .quiz-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .quiz-meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
  .quiz-start-btn {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white; border: none; padding: 11px; border-radius: 10px;
    font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .coin-toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--success); color: white;
    padding: 12px 20px; border-radius: 30px;
    font-weight: 700; font-size: 14px; z-index: 200;
    transition: transform 0.35s ease;
  }
  .coin-toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <h1>🏹 Kitob Ovi</h1>
  <div class="balance-pill">
    <span>🪙</span>
    <span id="balance">0</span>
  </div>
</div>

<div class="container">
  <!-- Kitoblar -->
  <div id="tab-kitoblar" class="tab-content active">
    <div class="card">
      <div class="book-title" id="book-title">Yuklanmoqda...</div>
      <div class="book-author" id="book-author"></div>
      <div class="page-indicator" id="page-indicator"></div>
      <div class="page-text" id="page-text"></div>
      <br>
      <button class="btn btn-primary" id="next-page-btn" onclick="nextPage()">Keyingi sahifa</button>
    </div>
  </div>

  <!-- Tanlov -->
  <div id="tab-tanlov" class="tab-content">
    <div class="card">
      <h3 style="margin-bottom:12px">🏆 Tanlov</h3>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px">Bilimingizni sinang, testdan o'tib koin yuting!</p>
      <div id="quiz-list"></div>
    </div>
  </div>

  <!-- Reyting -->
  <div id="tab-reyting" class="tab-content">
    <div class="card">
      <h3 style="margin-bottom:12px">📊 Reyting</h3>
      <div class="lb-tabs">
        <button class="lb-tab-btn active" onclick="showLb('coins')">🪙 Koin bo'yicha</button>
        <button class="lb-tab-btn" onclick="showLb('referrals')">👥 Taklif bo'yicha</button>
      </div>
      <div id="leaderboard"></div>
    </div>
  </div>

  <!-- Do'stlar -->
  <div id="tab-dostlar" class="tab-content">
    <div class="card">
      <div class="big-balance">
        <div class="num" id="ref-coins">0</div>
        <div class="label">Jami to'plangan koin</div>
      </div>
      <div class="ref-box">
        <div class="ref-link" id="ref-link">Yuklanmoqda...</div>
        <button class="copy-btn" onclick="copyRef()">Nusxalash</button>
      </div>
      <div class="info-text" id="ref-info"></div>
    </div>
  </div>

  <!-- Do'kon -->
  <div id="tab-dokon" class="tab-content">
    <div class="card">
      <h3 style="margin-bottom:14px">🎁 Do'kon</h3>
      <div id="shop-list"></div>
    </div>
  </div>

  <!-- Sirli Sandiq -->
  <div id="tab-sandiq" class="tab-content">
    <div class="card">
      <h3 style="margin-bottom:6px">🎁 Sirli Sandiq</h3>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:18px">Sandiq oching va tasodifiy sovg'a yuting!</p>
      <div class="chest-grid" id="chest-list"></div>
    </div>
  </div>

  <!-- Profil -->
  <div id="tab-profil" class="tab-content">
    <div class="card">
      <div class="profile-header">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="profile-name" id="profile-name">—</div>
          <div class="profile-username" id="profile-username"></div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="num" id="stat-books">0</div><div class="label">Kitoblar</div></div>
        <div class="stat-box"><div class="num" id="stat-streak">0</div><div class="label">Kun seriya</div></div>
        <div class="stat-box"><div class="num" id="stat-refs">0</div><div class="label">Do'stlar</div></div>
        <div class="stat-box"><div class="num" id="stat-premium">—</div><div class="label">Premium</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Pastki menyu -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('kitoblar')"><span class="icon">📚</span>Kitoblar</button>
  <button class="tab-btn" onclick="switchTab('tanlov')"><span class="icon">🏆</span>Tanlov</button>
  <button class="tab-btn" onclick="switchTab('reyting')"><span class="icon">📊</span>Reyting</button>
  <button class="tab-btn" onclick="switchTab('dostlar')"><span class="icon">👥</span>Do'stlar</button>
  <button class="tab-btn" onclick="switchTab('dokon')"><span class="icon">🎁</span>Do'kon</button>
  <button class="tab-btn" onclick="switchTab('sandiq')"><span class="icon">📦</span>Sandiq</button>
  <button class="tab-btn" onclick="switchTab('profil')"><span class="icon">👤</span>Profil</button>
</div>

<!-- Sandiq animatsiyasi -->
<div class="chest-overlay" id="chest-overlay">
  <div class="chest-anim" id="chest-anim-emoji">📦</div>
  <div class="reward-box" id="reward-box" style="display:none">
    <div style="font-size:42px" id="reward-emoji">🎉</div>
    <div class="reward-text" id="reward-text">+50 koin</div>
    <br>
    <button class="btn btn-primary" onclick="closeChestAnim()" style="margin-top:12px">Yopish</button>
  </div>
</div>

<div class="coin-toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
let userData = null;
let currentPage = 0;

// ========== UMUMIY ==========
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');

  if (name === 'sandiq') loadChests();
  if (name === 'reyting') loadLeaderboard();
  if (name === 'dokon') loadShop();
  if (name === 'dostlar') loadFriends();
  if (name === 'profil') loadProfile();
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.innerText = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function api(path, method = 'GET', body = null) {
  const url = path + (path.includes('?') ? '&' : '?') + 'initData=' + encodeURIComponent(initData);
  const opts = { method };
  if (body) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  return res.json();
}

// ========== SIRLI SANDIQ ==========
async function loadChests() {
  const data = await api('/api/chests');
  if (data.error) return;

  document.getElementById('balance').innerText = data.coins;

  const list = document.getElementById('chest-list');
  list.innerHTML = '';

  data.chests.forEach(chest => {
    const canOpen = chest.can_open;
    const div = document.createElement('div');
    div.className = 'chest-card';
    div.innerHTML = `
      <span class="chest-emoji">${chest.emoji}</span>
      <div class="chest-name">${chest.name}</div>
      <div class="chest-cost">${chest.cost} 🪙</div>
      <div class="chest-limit">Bugun: \( {chest.opened_today}/ \){chest.daily_limit} (qoldi ${chest.remaining})</div>
      <button class="chest-btn" \( {canOpen ? '' : 'disabled'} onclick="openChest(' \){chest.id}', '${chest.emoji}')">
        ${canOpen ? 'Ochish' : (chest.remaining === 0 ? 'Limit tugadi' : 'Koin yetarli emas')}
      </button>
    `;
    list.appendChild(div);
  });
}

async function openChest(chestId, emoji) {
  const overlay = document.getElementById('chest-overlay');
  const animEmoji = document.getElementById('chest-anim-emoji');
  const rewardBox = document.getElementById('reward-box');

  animEmoji.innerText = emoji;
  rewardBox.style.display = 'none';
  overlay.classList.add('show');

  // 1.2 soniya animatsiya
  await new Promise(r => setTimeout(r, 1200));

  const data = await api('/api/open_chest', 'POST', { chest_id: chestId });

  if (data.error) {
    overlay.classList.remove('show');
    if (data.error === 'limit_reached') showToast('Bugungi limit tugagan');
    else if (data.error === 'not_enough_coins') showToast('Koin yetarli emas');
    else showToast('Xatolik yuz berdi');
    return;
  }

  document.getElementById('reward-emoji').innerText = data.reward_type === 'premium' ? '⭐' : '🪙';
  document.getElementById('reward-text').innerText = data.reward_text;
  rewardBox.style.display = 'block';

  document.getElementById('balance').innerText = data.new_balance;
}

function closeChestAnim() {
  document.getElementById('chest-overlay').classList.remove('show');
  loadChests();
}

// ========== BOSHQA FUNKSIYALAR (qisqartirilgan ishlaydigan qism) ==========
async function loadMe() {
  const data = await api('/api/me');
  if (data.error) return;
  userData = data;
  document.getElementById('balance').innerText = data.coins;

  if (data.streak_bonus_granted) showToast(`🔥 +${data.streak_bonus_granted} koin (streak)`);
  if (data.daily_bonus_granted) showToast(`⭐ +${data.daily_bonus_granted} koin (premium bonus)`);
}

async function loadLeaderboard() {
  const data = await api('/api/leaderboard');
  showLbData(data.coins, 'coins');
}

function showLb(type) {
  document.querySelectorAll('.lb-tab-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  api('/api/leaderboard').then(data => {
    showLbData(type === 'coins' ? data.coins : data.referrals, type);
  });
}

function showLbData(list, type) {
  const el = document.getElementById('leaderboard');
  el.innerHTML = list.map((r, i) => `
    <div class="lb-row">
      <div class="lb-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)}</div>
      <div class="lb-name">${r.name}</div>
      <div class="lb-value">\( {r.value} \){type === 'coins' ? ' 🪙' : ' 👥'}</div>
    </div>
  `).join('');
}

async function loadShop() {
  const data = await api('/api/shop_items');
  const list = document.getElementById('shop-list');
  list.innerHTML = data.items.map(item => `
    <div class="shop-item">
      <div class="shop-emoji">${item.emoji}</div>
      <div class="shop-info">
        <div class="shop-name">${item.name}</div>
        <div class="shop-cost">${item.cost} 🪙</div>
      </div>
      ${item.owned ? '<span class="owned-tag">Olingan</span>' :
        `<button class="buy-btn" \( {item.can_buy ? '' : 'disabled'} onclick="buyItem(' \){item.id}')">Sotib olish</button>`}
    </div>
  `).join('');
}

async function buyItem(id) {
  const data = await api('/api/purchase', 'POST', { item_id: id });
  if (data.success) {
    showToast(`✅ ${data.item_name} sotib olindi!`);
    document.getElementById('balance').innerText = data.coins;
    loadShop();
  } else {
    showToast('Xatolik');
  }
}

async function loadFriends() {
  if (!userData) return;
  document.getElementById('ref-coins').innerText = userData.coins;
  const link = `https://t.me/Kitob_coin_bot?start=ref_${userData.user_id}`;
  document.getElementById('ref-link').innerText = link;
  document.getElementById('ref-info').innerHTML = `
    Taklif qilingan do'stlar: <b>${userData.referral_count}</b><br><br>
    Do'stingizni taklif qiling — u kanallarga a'zo bo'lib ilovani ochsa, sizga <b>+300 koin</b> qo'shiladi!
  `;
}

function copyRef() {
  const link = document.getElementById('ref-link').innerText;
  navigator.clipboard.writeText(link);
  showToast('Havola nusxalandi!');
}

async function loadProfile() {
  if (!userData) return;
  document.getElementById('avatar').innerText = (userData.username || 'U')[0].toUpperCase();
  document.getElementById('profile-name').innerText = userData.username || 'Foydalanuvchi';
  document.getElementById('stat-streak').innerText = userData.streak_days || 0;
  document.getElementById('stat-refs').innerText = userData.referral_count || 0;
