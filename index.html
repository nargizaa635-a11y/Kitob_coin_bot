<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitob o'qib koin yig'ish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --card-2: #212434;
    --accent: #7c5cff;
    --accent-2: #ff8a5c;
    --text: #f0f0f5;
    --text-dim: #9a9cab;
    --success: #4ade80;
    --border: #2a2e42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 80px;
    min-height: 100vh;
  }
  .header {
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
  }
  .balance-pill {
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(124, 92, 255, 0.35);
  }
  .container {
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    padding: 8px 4px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--accent);
    background: rgba(124, 92, 255, 0.12);
  }
  .tab-btn .icon { font-size: 20px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Kitob bo'limi */
  .book-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .book-author {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .page-indicator {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .page-text {
    line-height: 1.7;
    font-size: 15px;
    color: #dcdce6;
    min-height: 180px;
  }
  .timer-box {
    margin-top: 20px;
    text-align: center;
  }
  .timer-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    font-weight: 700;
    font-size: 18px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    color: white;
  }
  .btn-disabled {
    background: var(--card-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .coin-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--success);
    color: #063;
    padding: 12px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    z-index: 200;
    transition: transform 0.35s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .coin-toast.show { transform: translateX(-50%) translateY(0); }

  /* Do'stlar bo'limi */
  .big-balance {
    text-align: center;
    padding: 24px 0;
  }
  .big-balance .num {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .big-balance .label {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .ref-box {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .ref-link {
    flex: 1;
    font-size: 12px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .copy-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .info-text {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
    margin-top: 14px;
  }

  /* Do'kon bo'limi */
  .shop-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--card-2);
    border-radius: 14px;
    margin-bottom: 10px;
  }
  .shop-emoji { font-size: 30px; }
  .shop-info { flex: 1; }
  .shop-name { font-weight: 700; font-size: 14px; }
  .shop-cost { color: var(--accent-2); font-size: 13px; font-weight: 600; margin-top: 2px; }
  .buy-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .buy-btn:disabled {
    background: var(--card);
    color: var(--text-dim);
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📖 Kitob & Koin</h1>
  <div class="balance-pill">🪙 <span id="headerBalance">0</span></div>
</div>

<div class="container">

  <!-- ===== KITOBLAR TAB ===== -->
  <div class="tab-content active" id="tab-books">
    <div class="card">
      <div class="book-title">Sahroning siri</div>
      <div class="book-author">Bir bo'lakli qissa</div>
      <div class="page-indicator">Sahifa <span id="pageNum">1</span> / <span id="pageTotal">5</span></div>
      <div class="page-text" id="pageText"></div>

      <div class="timer-box" id="timerBox">
        <div class="timer-circle" id="timerCircle">30</div>
        <div style="color: var(--text-dim); font-size: 13px;">O'qib bo'lguningizcha kuting...</div>
      </div>

      <div style="margin-top: 16px;">
        <button class="btn btn-primary" id="nextPageBtn" style="display:none;">Keyingi sahifa (+10 🪙)</button>
      </div>
    </div>
  </div>

  <!-- ===== DO'STLAR TAB ===== -->
  <div class="tab-content" id="tab-friends">
    <div class="card">
      <div class="big-balance">
        <div class="num" id="friendsBalance">0</div>
        <div class="label">Jami to'plangan koin</div>
      </div>
      <div class="ref-box">
        <div class="ref-link" id="refLink">yuklanmoqda...</div>
        <button class="copy-btn" id="copyRefBtn">Nusxalash</button>
      </div>
      <div class="info-text">
        👥 Do'stingizni shu havola orqali taklif qiling. U kanallarga a'zo bo'lib, ilovani ochsa —
        sizga <b>+150 koin</b> avtomatik qo'shiladi!
      </div>
    </div>
  </div>

  <!-- ===== DO'KON TAB ===== -->
  <div class="tab-content" id="tab-shop">
    <div class="card">
      <div id="shopList"></div>
    </div>
  </div>

</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="books">
    <span class="icon">📚</span>
    <span>Kitoblar</span>
  </button>
  <button class="tab-btn" data-tab="friends">
    <span class="icon">👥</span>
    <span>Do'stlar</span>
  </button>
  <button class="tab-btn" data-tab="shop">
    <span class="icon">🎁</span>
    <span>Do'kon</span>
  </button>
</div>

<div class="coin-toast" id="coinToast">+10 🪙 qo'shildi!</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ================== HOLAT ==================
let state = {
  coins: 0,
  currentPage: 0,
  timerInterval: null,
  timeLeft: 30,
};

const BOOK_PAGES = [
  "Sahroning qoq o'rtasida, quyosh tig'ida yolg'iz yurgan Sardor uzoqdan bir soyani ko'rdi. U charchagan, lekin umidini yo'qotmagan edi. Har bir qadam unga yangi kuch berayotgandek tuyulardi...",
  "Soya yaqinlashgan sari, u buni eski bir karvon yo'lovchisi ekanini angladi. Chol unga suv taklif qildi va sahroning sirlari haqida gapira boshladi — bu yerda har bir qumtepaning o'z tarixi bor edi...",
  "\"Bu yo'lda yurganlarning barchasi bir narsani izlaydi\", dedi chol. \"Sen nimani izlayapsan, yigit?\" Sardor bir lahza jim qoldi, so'ng javob berdi: \"Men o'zimni izlayapman...\"",
  "Kechqurun ular olov yoqib, yulduzlar ostida o'tirishdi. Chol unga qadimiy bir xazina haqida hikoya qildi — bu xazina oltin emas, balki har bir insonning ichida yashiringan kuch edi...",
  "Ertalab Sardor uyg'onganida, chol yo'q edi. Faqat qumga chizilgan bir belgi qolgan edi. U buni tushundi: haqiqiy sayohat hali boshlanmagan, u hozirgina o'z ichki dunyosini kashf qila boshlagan edi."
];

// ================== API FUNKSIYALARI ==================

async function apiGet(path) {
  const initData = tg.initData;
  const res = await fetch(`${path}?initData=${encodeURIComponent(initData)}`);
  return res.json();
}

async function apiPost(path, data) {
  const initData = tg.initData;
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...data, initData }),
  });
  return res.json();
}

async function loadUserData() {
  try {
    const data = await apiGet("/api/me");
    if (data.error) {
      console.error("Auth xatosi:", data.error);
      return;
    }
    state.coins = data.coins;
    updateBalanceDisplay();
    document.getElementById("refLink").textContent = data.referral_link;
    window._refLink = data.referral_link;
  } catch (e) {
    console.error("Ma'lumot yuklashda xato:", e);
  }
}

function updateBalanceDisplay() {
  document.getElementById("headerBalance").textContent = state.coins;
  document.getElementById("friendsBalance").textContent = state.coins;
  renderShop(); // do'kon tugmalari balansga qarab yoqiladi/o'chadi
}

function showCoinToast(amount) {
  const toast = document.getElementById("coinToast");
  toast.textContent = `+${amount} 🪙 qo'shildi!`;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

// ================== TABLAR ==================

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    tg.HapticFeedback.impactOccurred("light");
  });
});

// ================== KITOB O'QISH MANTIG'I ==================

function renderPage() {
  document.getElementById("pageNum").textContent = state.currentPage + 1;
  document.getElementById("pageTotal").textContent = BOOK_PAGES.length;
  document.getElementById("pageText").textContent = BOOK_PAGES[state.currentPage];

  const nextBtn = document.getElementById("nextPageBtn");
  const timerBox = document.getElementById("timerBox");

  if (state.currentPage >= BOOK_PAGES.length - 1) {
    // Kitob tugadi
    timerBox.style.display = "none";
    nextBtn.style.display = "block";
    nextBtn.textContent = "📖 Kitob tugadi!";
    nextBtn.className = "btn btn-disabled";
    nextBtn.disabled = true;
    return;
  }

  timerBox.style.display = "block";
  nextBtn.style.display = "none";
  startPageTimer();
}

function startPageTimer() {
  clearInterval(state.timerInterval);
  state.timeLeft = 30;
  document.getElementById("timerCircle").textContent = state.timeLeft;

  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    document.getElementById("timerCircle").textContent = state.timeLeft;

    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      onTimerFinished();
    }
  }, 1000);
}

async function onTimerFinished() {
  document.getElementById("timerBox").style.display = "none";
  const nextBtn = document.getElementById("nextPageBtn");
  nextBtn.style.display = "block";
  nextBtn.className = "btn btn-primary";
  nextBtn.disabled = false;
  nextBtn.textContent = "Keyingi sahifa (+10 🪙)";

  // Koinni serverga yozamiz
  try {
    const result = await apiPost("/api/earn", { amount: 10 });
    if (result.success) {
      state.coins = result.coins;
      updateBalanceDisplay();
      showCoinToast(10);
      tg.HapticFeedback.notificationOccurred("success");
    }
  } catch (e) {
    console.error("Koin qo'shishda xato:", e);
  }
}

document.getElementById("nextPageBtn").addEventListener("click", () => {
  if (state.currentPage < BOOK_PAGES.length - 1) {
    state.currentPage++;
    renderPage();
  }
});

// ================== DO'STLAR TAB ==================

document.getElementById("copyRefBtn").addEventListener("click", () => {
  const link = window._refLink || "";
  navigator.clipboard.writeText(link).then(() => {
    tg.HapticFeedback.notificationOccurred("success");
    const btn = document.getElementById("copyRefBtn");
    const original = btn.textContent;
    btn.textContent = "✅ Nusxalandi!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  }).catch(() => {
    tg.showAlert("Havolani nusxalab bo'lmadi. Qo'lda nusxalang: " + link);
  });
});

// ================== DO'KON TAB ==================

const SHOP_ITEMS = [
  { id: "book1", emoji: "📗", name: "Yangi kitob: \"Yulduzlar sayohati\"", cost: 100 },
  { id: "book2", emoji: "📘", name: "Yangi kitob: \"Vaqt mashinasi\"", cost: 150 },
  { id: "badge", emoji: "🏅", name: "Faxriy nishon (profilga)", cost: 80 },
  { id: "premium", emoji: "⭐", name: "1 haftalik Premium a'zolik", cost: 500 },
];

function renderShop() {
  const list = document.getElementById("shopList");
  list.innerHTML = "";
  SHOP_ITEMS.forEach(item => {
    const canAfford = state.coins >= item.cost;
    const el = document.createElement("div");
    el.className = "shop-item";
    el.innerHTML = `
      <div class="shop-emoji">${item.emoji}</div>
      <div class="shop-info">
        <div class="shop-name">${item.name}</div>
        <div class="shop-cost">${item.cost} 🪙</div>
      </div>
      <button class="buy-btn" ${canAfford ? "" : "disabled"} data-id="${item.id}" data-cost="${item.cost}">
        ${canAfford ? "Sotib olish" : "Yetarli emas"}
      </button>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll(".buy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const cost = parseInt(btn.dataset.cost);
      const itemId = btn.dataset.id;
      btn.disabled = true;
      btn.textContent = "...";
      try {
        const result = await apiPost("/api/purchase", { cost, item: itemId });
        if (result.success) {
          state.coins = result.coins;
          updateBalanceDisplay();
          tg.HapticFeedback.notificationOccurred("success");
          tg.showAlert("✅ Xarid muvaffaqiyatli amalga oshirildi!");
        } else {
          tg.showAlert("❌ Koin yetarli emas.");
        }
      } catch (e) {
        tg.showAlert("Xatolik yuz berdi, qayta urinib ko'ring.");
      }
      renderShop();
    });
  });
}

// ================== ISHGA TUSHIRISH ==================

async function init() {
  await loadUserData();
  renderPage();
  renderShop();
}

init();
</script>

</body>
</html>
